name: Deploy to Staging

on:
  push:
    branches:
      - stg
    paths:
      - 'kintone/app/**'
      - 'scripts/apply-customize.js'

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy kintone customizations (staging)
    runs-on: ubuntu-slim
    environment: staging

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Deploy to staging
        env:
          KINTONE_BASE_URL: ${{ secrets.KINTONE_BASE_URL }}
          KINTONE_USERNAME: ${{ secrets.KINTONE_USERNAME }}
          KINTONE_PASSWORD: ${{ secrets.KINTONE_PASSWORD }}
        run: node scripts/apply-customize.js staging
